<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Projetify</title>
    <link rel="stylesheet" href="cadastro_style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h2>Projetify</h2>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="">Dashboard</a></li>
          <li><a href="cadastro.html">Cadastre-se</a></li>
          <li><a href="">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
         <form>
          <label for="perfil">Tipo de Perfil</label>
          <select id="perfil" name="perfil" required>
            <option value="">Selecione...</option>
            <option value="empresa">Empresa</option>
            <option value="coordenacao">Coordenação</option>
            <option value="professor">Professor</option>
            <option value="aluno">Aluno</option>
          </select>

          <label for="email_matricula">E-mail/Matrícula</label>
          <input
            type="text"
            id="email_matricula"
            name="email_matricula"
            placeholder="Digite seu e-mail ou matrícula"
            required
          />

          <label for="nome">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            required
          />

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            required
          />

          <button type="submit">Cadastrar</button>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2025 Projetify - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
