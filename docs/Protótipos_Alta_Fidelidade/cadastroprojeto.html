<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Projeto - Projetify</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: #ffffff;
        color: #00205b;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: #00205b;
        color: #ffffff;
        padding: 1rem 2rem;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      nav h2 {
        text-align: center;
        font-size: 1.5rem;
        color: #ffb81c;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 1.5rem;
        align-items: center;
      }

      nav ul li a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
      }

      nav ul li a:hover {
        color: #ffb81c;
      }

      @media (max-width: 767px) {
        nav {
          flex-direction: column;
          text-align: center;
        }

        nav h2 {
          margin-bottom: 1rem;
        }
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }

      form {
        background-color: #f5f7fa;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-header {
        text-align: center;
        margin-bottom: 1rem;
      }

      .form-header h2 {
        color: #00205b;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      .form-header p {
        color: #555;
      }

      label {
        font-weight: 600;
        color: #00205b;
        text-align: left;
      }

      input,
      select,
      textarea {
        padding: 0.8rem;
        border-radius: 8px;
        border: 1.5px solid #ccc;
        outline: none;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #00205b;
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      button {
        background-color: #00205b;
        color: #ffb81c;
        border: none;
        border-radius: 8px;
        padding: 0.9rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
      }

      button:hover {
        background-color: #ffb81c;
        color: #00205b;
      }

      .form-row {
        display: flex;
        gap: 1rem;
      }

      .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      footer {
        background-color: #00205b;
        color: #ffffff;
        text-align: center;
        padding: 1.5rem 1rem;
        font-size: 0.9rem;
      }

      footer p {
        color: #ffb81c;
      }

      @media (max-width: 600px) {
        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <h2>Projetify</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="cadastro.html">Cadastre-se</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form id="formCadastroProjeto">
        <div class="form-header">
          <h2>Cadastrar Novo Projeto</h2>
          <p>Preencha os dados do projeto abaixo</p>
        </div>

        <div class="form-group">
          <label for="titulo">Título do Projeto</label>
          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Digite o título do projeto"
            required
          />
        </div>

        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            placeholder="Descreva o objetivo e escopo do projeto"
            required
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="pesquisa">Pesquisa</option>
              <option value="desenvolvimento">Desenvolvimento</option>
              <option value="inovacao">Inovação</option>
              <option value="social">Social</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade" required>
              <option value="">Selecione...</option>
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="data_inicio">Data de Início</label>
            <input
              type="date"
              id="data_inicio"
              name="data_inicio"
              required
            />
          </div>

          <div class="form-group">
            <label for="data_termino">Data de Término</label>
            <input
              type="date"
              id="data_termino"
              name="data_termino"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="responsavel">Responsável</label>
          <input
            type="text"
            id="responsavel"
            name="responsavel"
            placeholder="Nome do responsável pelo projeto"
            required
          />
        </div>

        <div class="form-group">
          <label for="equipe">Membros da Equipe</label>
          <input
            type="text"
            id="equipe"
            name="equipe"
            placeholder="Nomes dos membros (separados por vírgula)"
          />
        </div>

        <div class="form-group">
          <label for="orcamento">Orçamento (R$)</label>
          <input
            type="number"
            id="orcamento"
            name="orcamento"
            placeholder="Valor do orçamento"
            min="0"
            step="0.01"
          />
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="">Selecione...</option>
            <option value="planejamento">Planejamento</option>
            <option value="andamento">Em Andamento</option>
            <option value="pausado">Pausado</option>
            <option value="concluido">Concluído</option>
          </select>
        </div>

        <button type="submit">Cadastrar Projeto</button>
      </form>
    </main>

    <footer>
      <p>© 2025 Projetify - Todos os direitos reservados.</p>
    </footer>

    <script>
      document.getElementById('formCadastroProjeto').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Validação básica das datas
        const dataInicio = new Date(document.getElementById('data_inicio').value);
        const dataTermino = new Date(document.getElementById('data_termino').value);
        
        if (dataTermino < dataInicio) {
          alert('A data de término não pode ser anterior à data de início!');
          return;
        }
        
        // Simulação de cadastro bem-sucedido
        alert('Projeto cadastrado com sucesso!');
        this.reset();
      });
    </script>
  </body>
</html>
